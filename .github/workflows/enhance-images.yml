name: Restore under-resolution website photographs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enhance-images.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hodnett-image-restoration
  cancel-in-progress: false

jobs:
  enhance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: python -m pip install pillow==11.3.0
      - name: Inspect all source images before changes
        run: python scripts/audit_image_quality.py
      - name: Preserve compositions while improving low-resolution photographs
        run: python scripts/enhance_images.py
      - name: Inspect every enhanced result
        run: python scripts/audit_image_quality.py
      - name: Check restoration manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('docs/image-enhancement-report.json').read_text())
          audit=json.loads(Path('docs/image-quality-audit.json').read_text())
          print('Scanned:', report['scanned'], 'Changed:', report['enhanced'], 'Exceptions:', report['skipped'])
          print('Post-treatment below target:', audit['below_target'], audit['below_target_by_role'])
          if report['skipped']:
              print('Preserved without replacement:', report['skips'])
          PY
      - name: Commit improved source assets, preserving originals in Git history
        id: save
        run: |
          git config user.name "atrezzo-photo-quality[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets docs/image-quality-audit.json docs/image-enhancement-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade low-resolution Hodnett photography with fidelity-checked WebP assets"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild GitHub Pages with revised photographic assets
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
