name: Publish Team Hodnett preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test property search
        run: npm test
      - name: Syntax-check browser modules
        run: |
          node --check public/src/ui.js
          node --check public/src/assistant.mjs
          node --check public/src/assistant-core.mjs
          node --check public/src/sharon-story.js
          node --check scripts/home.mjs
          node --check scripts/build.mjs
          node --check scripts/templates.mjs
      - name: Build for repository subpath
        env:
          SITE_BASE_PATH: /Team-Hodnett
        run: npm run build
      - name: Syntax-check generated knowledge
        run: node --check dist/data/knowledge.mjs
      - name: Validate site links and assets
        env:
          SITE_BASE_PATH: /Team-Hodnett
        run: npm run check
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
